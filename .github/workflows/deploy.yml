# Build Vidmate and deploy to Hostinger VPS (SSH + scp — clearer errors than scp-action)

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "::error::Missing VPS_HOST"; missing=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "::error::Missing VPS_USER"; missing=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "::error::Missing VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Create production env
        run: |
          cat > .env.local << EOF
          VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
          VITE_GOOGLE_SITE_VERIFICATION=${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_ADSENSE_CLIENT=${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_HOME=${{ secrets.VITE_ADSENSE_SLOT_HOME }}
          VITE_ADSENSE_SLOT_SIDEBAR=${{ secrets.VITE_ADSENSE_SLOT_SIDEBAR }}
          EOF

      - name: Build
        run: npm run build

      - name: Pack dist and API
        run: |
          tar -czf dist.tar.gz -C dist .
          tar -czf server.tar.gz server package.json package-lock.json ecosystem.config.cjs

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH_OK && whoami && hostname"

      - name: Prepare folders on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /tmp/vidmate-deploy /var/www/vidmate /var/www/vidmate-api"

      - name: Upload archives to VPS
        run: |
          scp -o ConnectTimeout=60 dist.tar.gz server.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/vidmate-deploy/"
          echo "Upload finished."

      - name: Extract website and API
        env:
          WEB_ROOT: ${{ secrets.VPS_WEB_ROOT || '/var/www/vidmate' }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -e
            WEB_ROOT='${WEB_ROOT}'
            test -f /tmp/vidmate-deploy/dist.tar.gz
            test -f /tmp/vidmate-deploy/server.tar.gz
            mkdir -p \"\$WEB_ROOT\" /var/www/vidmate-api
            tar -xzf /tmp/vidmate-deploy/dist.tar.gz -C \"\$WEB_ROOT\"
            tar -xzf /tmp/vidmate-deploy/server.tar.gz -C /var/www/vidmate-api
            chown -R www-data:www-data \"\$WEB_ROOT\" 2>/dev/null || true
            cd /var/www/vidmate-api && npm install --omit=dev --ignore-scripts
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart vidmate-api 2>/dev/null || pm2 start ecosystem.config.cjs
              pm2 save 2>/dev/null || true
            else
              echo 'WARN: install pm2 on VPS for downloads API'
            fi
            rm -f /tmp/vidmate-deploy/dist.tar.gz /tmp/vidmate-deploy/server.tar.gz
            echo Deployed site and API"
