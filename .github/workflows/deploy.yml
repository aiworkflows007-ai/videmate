# Build Vidmate and deploy to Hostinger VPS (SSH + scp — clearer errors than scp-action)

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "::error::Missing VPS_HOST"; missing=1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "::error::Missing VPS_USER"; missing=1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "::error::Missing VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -eq 1 ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Create production env
        run: |
          cat > .env.local << EOF
          VITE_SITE_URL=${{ secrets.VITE_SITE_URL }}
          VITE_GOOGLE_SITE_VERIFICATION=${{ secrets.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_ADSENSE_CLIENT=${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT_HOME=${{ secrets.VITE_ADSENSE_SLOT_HOME }}
          VITE_ADSENSE_SLOT_SIDEBAR=${{ secrets.VITE_ADSENSE_SLOT_SIDEBAR }}
          EOF

      - name: Build
        run: npm run build

      - name: Pack dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH_OK && whoami && hostname"

      - name: Prepare folders on VPS
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /tmp/vidmate-deploy /var/www/vidmate"

      - name: Upload archive to VPS
        run: |
          scp -o ConnectTimeout=60 dist.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/vidmate-deploy/dist.tar.gz"
          echo "Upload finished."

      - name: Extract website files
        run: |
          WEB_ROOT="${{ secrets.VPS_WEB_ROOT }}"
          if [ -z "$WEB_ROOT" ]; then WEB_ROOT="/var/www/vidmate"; fi
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << ENDSSH
          set -e
          test -f /tmp/vidmate-deploy/dist.tar.gz
          mkdir -p "$WEB_ROOT"
          tar -xzf /tmp/vidmate-deploy/dist.tar.gz -C "$WEB_ROOT"
          chown -R www-data:www-data "$WEB_ROOT" 2>/dev/null || true
          rm -f /tmp/vidmate-deploy/dist.tar.gz
          ls -la "$WEB_ROOT" | head -15
          echo "Deployed to $WEB_ROOT"
          ENDSSH
