# Verify build on pull requests (no deploy).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --ignore-scripts
      - run: |
          echo 'VITE_SITE_URL=https://example.com' > .env.local
          npm run build
